name: Letchat code check

on:
  pull_request:
    paths:
      - "letchat-v4/**"
      - ".github/workflows/letchat-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: letchat-v4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: letchat-v4/package-lock.json
      - run: npm ci
      - run: npm run check
