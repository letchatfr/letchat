<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letchat</title><link rel="stylesheet" href="/style.css"></head><body><section id="auth" class="card"><h1>💬 Letchat</h1><div class="tabs"><button class="tab active" data-mode="login">Connexion</button><button class="tab" data-mode="register">Inscription</button></div><form id="authForm"><input id="username" placeholder="Nom d'utilisateur" required><input id="password" type="password" placeholder="Mot de passe" required><button id="authSubmit" class="primary">Se connecter</button></form><div id="authError" class="error"></div></section><section id="chat" class="hidden"><header><b>💬 Letchat</b><button id="profileBtn">🙂 <span id="myName">Profil</span></button><button id="logout">Déconnexion</button></header><div class="layout"><aside><button id="generalRoom" class="room">🌍 Tchat général</button><h4>UTILISATEURS <span id="onlineCount">0</span></h4><div id="users"></div><h4>MES AMIS</h4><div id="friends"></div></aside><main><div class="roomhead"><b id="roomTitle">Tchat général</b><span id="typing"></span></div><div id="messages"></div><form id="messageForm"><input id="messageInput" placeholder="Écrire un message..." maxlength="2000"><button class="primary">Envoyer</button></form></main></div></section><div id="profileModal" class="modal hidden"><div class="modalbox"><button id="closeProfile" class="close">×</button><h2 id="profileTitle">Profil</h2><div id="profileMeta"></div><div id="profileAvatar" class="big">🙂</div><label>Avatar</label><input id="profileAvatarInput"><label>Statut</label><input id="profileStatus"><label>Bio</label><textarea id="profileBio"></textarea><div id="profileError" class="error"></div><button id="saveProfile" class="primary">Enregistrer</button></div></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
