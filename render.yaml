services:
  - type: web
    name: letchat
    runtime: node
    rootDir: letchat-production-v4-google
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: letchat-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        value: letchat-1d79d
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: letchat-db
    plan: free
