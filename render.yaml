# Existing Letchat service: preserve the current database and secrets.
# Review service settings before manually applying this Blueprint.
services:
  - type: web
    name: letchat
    runtime: node
    rootDir: letchat-v4
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: letchat-1d79d
